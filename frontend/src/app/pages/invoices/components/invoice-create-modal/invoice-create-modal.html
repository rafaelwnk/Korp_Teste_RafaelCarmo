<app-modal modalId="create-invoice-modal" title="Nova nota fiscal">
  <p>Uma nova nota fiscal será criada em aberto. Você poderá adicionar os itens em seguida.</p>
  <div modal-footer>
    <button class="uk-button uk-button-default uk-modal-close" type="button">Cancelar</button>
    <button
      class="uk-button uk-button-primary uk-modal-close"
      type="button"
      (click)="create()">
      Criar
    </button>
  </div>
</app-modal>
