<div class="uk-light">
    <div class="uk-container-expand uk-margin-medium-left uk-margin-medium-right uk-padding-small uk-padding-remove-horizontal">
        <nav class="uk-navbar-container uk-navbar-transparent" uk-navbar>
            <div class="uk-navbar-left">
                <ul class="uk-navbar-nav">
                    <button type="button" class="uk-margin-top" uk-toggle="target: #offcanvas-nav-primary" uk-icon="icon: menu; ratio: 1.3"></button>
                </ul>
            </div>
        </nav>
    </div>
</div>
<div id="offcanvas-nav-primary" uk-offcanvas="overlay: true">
    <div class="uk-offcanvas-bar uk-flex uk-flex-column">
        <ul class="uk-nav uk-nav-primary uk-nav-center uk-margin-auto-vertical">
            <li class="uk-margin-medium">
                <a uk-toggle="target: #offcanvas-nav-primary">
                    <span class="uk-icon uk-margin-xsmall-right" uk-icon="icon: home"></span>
                    Página inicial
                </a>
            </li>
            <li class="uk-nav-divider"></li>
            <li class="uk-margin-medium">
                <a [routerLink]="['products']" uk-toggle="target: #offcanvas-nav-primary">
                    <span class="uk-icon uk-margin-xsmall-right" uk-icon="icon: cart"></span>
                    Produtos
                </a>
            </li>
            <li class="uk-nav-divider"></li>
            <li class="uk-margin-medium">
                <a uk-toggle="target: #offcanvas-nav-primary">
                    <span class="uk-icon uk-margin-xsmall-right" uk-icon="icon: file-text"></span>
                    Notas Fiscais
                </a>
            </li>
        </ul>
    </div>
</div>
